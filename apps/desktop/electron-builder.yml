appId: com.narthex.app
productName: Narthex
copyright: Copyright © 2026 Narthex contributors (MIT)
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
asar: true
mac:
  category: public.app-category.business
  target:
    - target: dmg
      arch: [arm64, x64]
win:
  target:
    - target: nsis
      arch: [x64, arm64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
linux:
  target: [AppImage]
  category: Office
